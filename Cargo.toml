[package]
name = "deskagent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
chrono = "0.4"
eframe = "0.28"
egui = "0.28"
portable-pty = "0.8"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-onig"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
